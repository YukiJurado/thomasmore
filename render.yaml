# Free web hosting with an external PostgreSQL database configured privately.
services:
  - type: web
    name: thomasmore-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start -w api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: CACHE_TTL_MS
        value: 30000
      - key: MAIL_RETRY_MS
        value: 10000
      - key: REQUIRE_DURABLE_STORAGE
        value: true
      - key: DATABASE_URL
        sync: false
